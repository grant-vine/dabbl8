# SPDX-License-Identifier: GPL-3.0-only
name: Dabbl8 host and package evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dabbl8-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang-18
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14.8'
      - id: node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26.11.0'
      - name: Install pinned host dependencies
        id: hostdeps
        run: |
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades clang-18=1:18.1.3-1 libclang-common-18-dev=1:18.1.3-1 libclang-cpp18=1:18.1.3-1 libclang1-18=1:18.1.3-1 libllvm18=1:18.1.3-1 llvm-18-linker-tools=1:18.1.3-1 libclang-rt-18-dev=1:18.1.3-1
          python -m venv .local-baseline/ci/venv
          .local-baseline/ci/venv/bin/python -m pip install -r ci/requirements.txt
          echo "$PWD/.local-baseline/ci/venv/bin" >> "$GITHUB_PATH"
      - name: Configure public image cache on this temporary runner
        run: |
          sudo python - <<'PYTHON_CACHE_CONFIG'
          import json
          from pathlib import Path
          config = Path('/etc/docker/daemon.json')
          data = json.loads(config.read_text()) if config.exists() else {}
          mirrors = data.setdefault('registry-mirrors', [])
          if 'https://mirror.gcr.io' not in mirrors:
              mirrors.append('https://mirror.gcr.io')
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text(json.dumps(data) + '\n')
          PYTHON_CACHE_CONFIG
          sudo systemctl restart docker
      - name: Acquire hash-verified target dependencies
        id: acquire
        run: python ci/bootstrap.py
      - name: Build and verify; record failures and skips
        if: always()
        env:
          D8_SETUP_OK: ${{ steps.python.outcome == 'success' && steps.node.outcome == 'success' && steps.hostdeps.outcome == 'success' && steps.acquire.outcome == 'success' }}
        run: python ci/run_evidence.py
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dabbl8-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/
            build/ui_new/report.txt
            build/ui_new/align.txt
          if-no-files-found: warn
          retention-days: 14
